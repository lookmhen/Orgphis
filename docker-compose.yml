version: '3.8'

services:
  phishcentral:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phishcentral-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/phishcentral.db
      - ADMIN_API_KEY=${ADMIN_API_KEY:-phish-secret-admin-key}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/system/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  data:
